<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>音符アプリ with H.K.</title>


  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="./assets/icons/favicon-48.png"
  >

  <meta
    name="theme-color"
    content="#f5f0e6"
  >

  <!-- PWA設定 -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="音符 with H.K."
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icons/apple-touch-icon.png"
  >

</head>


<body>

  <!-- 音声開始用オーバーレイ -->

  <div id="audioStartOverlay">
    <div id="audioStartMessage">
      タップして開始
    </div>
  </div>


  <!-- 鍵盤 -->

  <div id="imageArea">

    <img
      id="noteImage"
      src="assets/keyboard-chart.png"
      alt="初黄から十一までの25鍵の鍵盤図"
      draggable="false"
    >

    <div id="keyPressMarker"></div>


    <div id="flashMarker"></div>

    <!-- 鍵盤と一体でレイアウトするためimageArea内に配置する。 -->
    <div id="keyControl">

      <button
        id="keyDown"
        type="button"
      >
        −
      </button>


      <button
        id="keyDisplay"
        type="button"
        title="押すとキー0に戻ります"
      >
        0
      </button>


      <button
        id="keyUp"
        type="button"
      >
        ＋
      </button>

    </div>


  </div>

  <!-- アプリ情報 -->
  <button
    id="infoButton"
    type="button"
    aria-label="このアプリについて"
    title="このアプリについて"
  >
    ⓘ
  </button>
  <div
    id="infoOverlay"
    aria-hidden="true"
  >

    <div
      id="infoDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="infoTitle"
    >

      <button
        id="infoCloseButton"
        type="button"
        aria-label="閉じる"
        title="閉じる"
      >
        ×
      </button>

      <h1 id="infoTitle">
        音符アプリ with H.K.
      </h1>

      <p>
        キャッシュ名: <span id="cacheNameValue">確認中...</span>
      </p>

      <p>
        このアプリは<strong>PWA（Progressive Web App）</strong>です。
        対応ブラウザでは、ホーム画面への追加やアプリとしてのインストールができます。
      </p>

      <p id="infoDisclaimer">
        本アプリの利用により生じた損害について、作者は責任を負いかねます。
      </p>

      <p id="infoCopyright">
        © 2026 Kazutaka Hashimoto
      </p>

      <section id="viewportDebug" aria-labelledby="viewportDebugTitle">
        <!-- <h2 id="viewportDebugTitle">Viewport Debug</h2> -->
        <pre id="viewportDebugValues" aria-live="polite"></pre>
      </section>

      

    </div>

  </div>
  <!-- Service Workerの更新準備が完了した場合のみ表示する。 -->
  <button
    id="updateNotice"
    type="button"
  >

    <strong>
      更新があります
    </strong>

    <br>

    タップして更新

  </button>

  <!-- script.jsが参照する音符データを先に読み込む。 -->
  <script src="notes.js"></script>
  <script src="script.js"></script>

  <script>
    if (
      "serviceWorker" in navigator
    ) {
      navigator.serviceWorker
        .register("./sw.js")

        .then(registration => {


          const updateNotice =
            document.getElementById(
              "updateNotice"
            );


          let isUpdateApplying =
            false;



          console.log(
            "Service Workerを登録しました"
          );

          function showUpdateNotice() {
            updateNotice.style.display =
              "block";

          }

          function applyUpdate() {


            const waitingWorker =
              registration.waiting;


            if (
              isUpdateApplying ||
              !waitingWorker
            ) {

              return;

            }


            isUpdateApplying =
              true;


            updateNotice.disabled =
              true;


            updateNotice.textContent =
              "更新しています...";


            // 事前キャッシュ済みのworkerへ即時有効化を依頼する。
            waitingWorker.postMessage({
              type: "SKIP_WAITING"
            });

          }



          updateNotice.addEventListener(
            "click",
            applyUpdate
          );



          // 新しいキャッシュへ切り替えるため、制御移行後に一度だけ再読み込みする。
          navigator.serviceWorker.addEventListener(
            "controllerchange",

            function() {

              if (
                !isUpdateApplying
              ) {

                return;

              }


              window.location.reload();

            }
          );

          if (
            registration.waiting
          ) {

            showUpdateNotice();

          }

          registration.addEventListener(
            "updatefound",

            function() {
              const newWorker =
                registration.installing;


              if (
                !newWorker
              ) {

                return;

              }

              newWorker.addEventListener(
                "statechange",

                function() {
                  // controllerがある場合のみ、初回導入ではなく更新として通知する。
                  if (
                    newWorker.state ===
                      "installed" &&

                    navigator.serviceWorker.controller
                  ) {
                    // 演奏中の自動再読み込みを避け、利用者の操作で更新する。
                    showUpdateNotice();

                  }


                }
              );


            }
          );


        })
        .catch(error => {


          console.error(
            "Service Workerの登録に失敗しました:",
            error
          );


        });


    }


  </script>


</body>

</html>
